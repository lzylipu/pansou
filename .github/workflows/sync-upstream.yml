name: Sync Upstream

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
      - name: Add upstream
        run: git remote add upstream https://github.com/fish2018/pansou.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream main
        run: git merge upstream/main --no-edit
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: git push https://x-access-token:${GITHUB_TOKEN}@github.com/lzylipu/pansou.git HEAD:main
