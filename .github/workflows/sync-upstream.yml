name: Sync Upstream

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
      - name: Add upstream
        run: git remote add upstream https://github.com/fish2018/pansou.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream main
        id: merge
        run: git merge upstream/main --no-edit
      - name: Get new commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Push ref via API
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          curl -s -o /dev/null -w "%{http_code}"             -X PUT             -H "Authorization: token $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/lzylipu/pansou/git/refs/heads/main             -d "{\"sha\":\"${{ steps.sha.outputs.sha }}\"}"
