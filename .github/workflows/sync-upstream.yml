name: Sync Upstream

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure git
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
      - name: Add upstream remote
        run: git remote add upstream https://github.com/fish2018/pansou.git || true
      - name: Fetch upstream
        run: git fetch upstream main
      - name: Merge upstream
        run: git merge upstream/main --no-edit
      - name: Push merged commits
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/lzylipu/pansou.git"
          git push origin HEAD:main
